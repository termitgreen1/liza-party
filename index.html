<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Закрытый игровой вечер</title><style>
*{box-sizing:border-box}body{margin:0;background:#171526;color:#fff9f1;font:20px/1.5 Arial,sans-serif}main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.card{width:100%;max-width:560px;padding:40px;border:1px solid #454057;border-radius:24px;background:#242136}.eyebrow{color:#ffa5c7;letter-spacing:3px;font-size:14px}h1{font-size:42px;line-height:1.1;margin:22px 0}p{color:#bab4cb}label{display:block;margin:20px 0 10px}input{width:100%;padding:16px;font:inherit;border:1px solid #696079;border-radius:12px;background:#171526;color:white}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:14px 22px;background:#d5f57a;color:#192113;font-weight:bold;margin-top:18px}button:focus-visible,input:focus-visible{outline:4px solid #ffa5c7;outline-offset:4px}button:disabled{opacity:.6}.show{display:flex;align-items:center;gap:10px;font-size:16px}.show input{width:22px;height:22px}#status{min-height:30px;font-size:16px}#stage{display:none}#game{border:0;width:100%;height:calc(100vh - 52px);display:block}#bar{height:52px;padding:5px 20px;text-align:right;background:#171526}#lock{font-size:15px;padding:8px 16px;margin:0}.small{font-size:15px}@media(min-width:1500px){.card{max-width:720px;padding:55px}h1{font-size:58px}body{font-size:26px}}</style></head><body><main id="gate"><section class="card"><div class="eyebrow">ТОЛЬКО ДЛЯ СВОИХ</div><h1>Игровой вечер</h1><p>Введите пароль от организатора, чтобы открыть игру.</p><form id="unlockForm"><label for="password">Пароль</label><input id="password" type="password" autocomplete="off" autocapitalize="none" spellcheck="false" required><label class="show"><input id="showPassword" type="checkbox">Показать пароль</label><button id="unlock" type="submit">Открыть игру →</button><p id="status" role="status" aria-live="polite"></p></form><p class="small">На телевизоре выберите поле пароля пультом и введите его экранной клавиатурой.</p></section></main><section id="stage"><div id="bar"><button id="lock" type="button">Закрыть игру</button></div><iframe id="game" title="Игровой вечер" allow="autoplay; fullscreen" allowfullscreen></iframe></section><script src="unlock.js"></script></body></html>
